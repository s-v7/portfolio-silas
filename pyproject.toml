[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-silas-automation"
version = "0.1.0"
description = "Internal multi-agent automation platform for portfolio-silas"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32,<3",
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.40",
]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["ai/tests"]
python_files = ["test_*.py"]
addopts = [
    "--strict-markers",
    "--strict-config",
]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [
    "ai/scripts",
    "ai/agents/update_about.py",
    "ai/agents/update_bio.py",
    "ai/agents/update_readme_en.py",
    "ai/agents/update_readme_pt.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
packages = ["ai"]
exclude = [
    "^ai/scripts/",
    "^ai/agents/update_.*\\.py$",
]
