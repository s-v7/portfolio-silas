<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard do Ecossistema - Portfolio Silas</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            color: #38bdf8;
            text-align: center;
        }
        .card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 24px;
            margin-top: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        .metric-title {
            font-size: 1.1rem;
            color: #94a3b8;
        }
        .metric-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #38bdf8;
        }
        canvas {
            max-height: 400px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌌 Visão do Ecossistema (ML Neural Classifier)</h1>
        
        <div class="card">
            <div class="metric-title">Total de Projetos & Evidências Analisadas</div>
            <div class="metric-value">150</div>
        </div>

        <div class="card">
            <canvas id="ecosystemChart"></canvas>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('ecosystemChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ["ai-mcp-llm", "backend-python", "backend-java-enterprise", "frontend-node-ts", "systems-c-shell", "infra-db-tools", "finance-tools", "general-dev"],
                datasets: [{
                    label: 'Quantidade de Projetos',
                    data: [40, 2, 36, 14, 26, 5, 4, 23],
                    backgroundColor: [
                        '#38bdf8', '#818cf8', '#c084fc', '#f472b6',
                        '#fb7185', '#34d399', '#fbbf24', '#94a3b8'
                    ],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: false },
                    title: {
                        display: true,
                        text: 'Distribuição de Competências por Categoria',
                        color: '#f8fafc',
                        font: { size: 16 }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: { color: '#94a3b8' },
                        grid: { color: '#334155' }
                    },
                    x: {
                        ticks: { color: '#94a3b8' },
                        grid: { display: false }
                    }
                }
            }
        });
    </script>
</body>
</html>
